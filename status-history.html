<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Status History | Vyshnavi</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@700&display=swap');

    [data-theme="dark"] {
      --bg: #070710;
      --card: #13131f;
      --border: #1e1e30;
      --text: #f1f0ff;
      --muted: #6b6b8a;
      --nav-bg: rgba(7,7,16,0.85);
    }

    [data-theme="light"] {
      --bg: #fafaff;
      --card: #ffffff;
      --border: #e0d8f0;
      --text: #1a1a2e;
      --muted: #6b6b8a;
      --nav-bg: rgba(250,250,255,0.9);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
      transition: background 0.4s, color 0.4s;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .back-btn {
      display: inline-block;
      background: rgba(192,132,252,0.08);
      border: 1px solid rgba(192,132,252,0.2);
      color: #c084fc;
      padding: 0.5rem 1.2rem;
      border-radius: 30px;
      text-decoration: none;
      font-size: 0.85rem;
      transition: all 0.3s;
    }

    .back-btn:hover { background: rgba(192,132,252,0.15); }

    .theme-toggle {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 0.4rem 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--muted);
      transition: all 0.3s;
    }

    .theme-toggle:hover { border-color: #c084fc; color: #c084fc; }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      background: linear-gradient(135deg, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 600px;
    }

    .history-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.2rem 1.5rem;
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      transition: border-color 0.3s;
    }

    .history-item:hover { border-color: rgba(192,132,252,0.4); }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4ade80;
      margin-top: 5px;
      flex-shrink: 0;
    }

    .status-content { flex: 1; }

    .status-text {
      font-size: 1rem;
      color: var(--text);
      margin-bottom: 0.3rem;
    }

    .status-time { font-size: 0.8rem; color: var(--muted); }

    .loading { color: var(--muted); font-size: 0.9rem; margin-top: 1rem; }
    .empty { color: var(--muted); font-size: 0.9rem; margin-top: 1rem; }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="portfolio.html" class="back-btn">← Back to Portfolio</a>
    <button class="theme-toggle" onclick="toggleTheme()">
      <span id="themeIcon">☀️</span>
      <span id="themeText">Light</span>
    </button>
  </div>

  <h1>Status History 📋</h1>
  <p class="subtitle">All previous status updates</p>

  <div class="history-list" id="historyList">
    <p class="loading">Loading history...</p>
  </div>

  <script>
    const API_URL = 'https://ughp9uo9s9.execute-api.ap-south-1.amazonaws.com/gethistory';

    // Load saved theme
    window.onload = function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      if (savedTheme === 'light') {
        document.getElementById('themeIcon').textContent = '🌙';
        document.getElementById('themeText').textContent = 'Dark';
      }
      loadHistory();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (html.getAttribute('data-theme') === 'dark') {
        html.setAttribute('data-theme', 'light');
        icon.textContent = '🌙';
        text.textContent = 'Dark';
        localStorage.setItem('theme', 'light');
      } else {
        html.setAttribute('data-theme', 'dark');
        icon.textContent = '☀️';
        text.textContent = 'Light';
        localStorage.setItem('theme', 'dark');
      }
    }

    async function loadHistory() {
      try {
        const res = await fetch(API_URL);
        const items = await res.json();
        const list = document.getElementById('historyList');

        if (!items.length) {
          list.innerHTML = '<p class="empty">No status history yet!</p>';
          return;
        }

        list.innerHTML = items.map(item => {
          const unixTime = parseFloat(item.unix_time) * 1000;
          const now = Date.now();
          const diff = Math.floor((now - unixTime) / 1000);

          let timeAgo = '';
          if (diff < 60) timeAgo = 'Just now';
          else if (diff < 3600) timeAgo = `${Math.floor(diff/60)} minutes ago`;
          else if (diff < 86400) timeAgo = `${Math.floor(diff/3600)} hours ago`;
          else timeAgo = `${Math.floor(diff/86400)} days ago`;

          return `
            <div class="history-item">
              <div class="status-dot"></div>
              <div class="status-content">
                <p class="status-text">${item.status}</p>
                <span class="status-time">${item.timestamp} IST · ${timeAgo}</span>
              </div>
            </div>
          `;
        }).join('');

      } catch (e) {
        document.getElementById('historyList').innerHTML = '<p class="empty">Could not load history!</p>';
      }
    }
  </script>

</body>
</html>
